<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4562e8">
  <meta name="description" content="아주대학교 식당의 주간 메뉴를 한국어와 중국어로 확인하세요. 查看亚洲大学食堂每周菜单，支持中韩双语。">
  <title>아주대학교 식단 · Ajou Menu</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script defer src="menu-data.js"></script>
  <script defer src="menu.js"></script>
</head>
<body>
  <a class="skip-link" href="#menuHeading" id="skipLink">메뉴로 바로가기</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./" aria-label="Ajou Menu">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 15h20c0 7-4 11-10 11S6 22 6 15Z" stroke="currentColor" stroke-width="2"/><path d="M4 15h24M11 6v4m5-6v6m5-4v4M10 27h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span><strong>AJOU <span>MENU</span></strong><small id="brandSubtitle">아주대학교 식단</small></span>
      </a>
      <div class="header-actions">
        <span class="campus-tag" id="campusTag">우리의 캠퍼스, 오늘의 한 끼</span>
        <button class="language-toggle" id="langToggle" type="button" aria-label="Switch to Chinese"><span aria-hidden="true">文</span><span id="languageLabel">中文</span></button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-copy">
        <p class="eyebrow">CAMPUS DINING</p>
        <h1 id="pageTitle">오늘, 뭐 먹을까요<span>?</span></h1>
        <p id="pageSubtitle">이번 주 식단을 한눈에. 맛있는 캠퍼스 생활의 시작.</p>
      </div>
      <div class="hero-date" aria-hidden="true"><span id="heroMonth">--</span><strong id="heroDay">--</strong><span id="heroWeekday">--</span></div>
    </section>

    <section class="calendar-panel" aria-label="날짜 선택" id="calendarPanel">
      <div class="calendar-heading">
        <div class="week-info"><span class="eyebrow" id="weekLabel">THIS WEEK</span><span id="weekRange"></span></div>
        <div class="calendar-actions"><div id="weekSwitch" class="week-switch" hidden></div><button id="todayButton" class="today-button" type="button">오늘로</button></div>
      </div>
      <div id="weekTabs" class="date-tabs"></div>
    </section>

    <div id="dataStatus" class="status-banner" role="status" hidden></div>

    <div class="workspace-grid">
      <aside class="selection-panel">
        <div class="selection-group">
          <h2 class="field-label" id="restaurantLabel">어디에서 먹을까요?</h2>
          <div id="restaurantTabs" class="restaurant-tabs" role="group" aria-labelledby="restaurantLabel"></div>
        </div>
        <div class="selection-group">
          <h2 class="field-label" id="mealLabel">어떤 식사를 찾으세요?</h2>
          <div id="mealTabs" class="meal-tabs" role="group" aria-labelledby="mealLabel"></div>
        </div>
        <div class="restaurant-detail">
          <span class="detail-symbol" aria-hidden="true">↗</span>
          <strong id="restaurantName"></strong>
          <p id="restaurantLocation"></p>
          <a id="sourceLink" class="text-link" href="https://www.ajou.ac.kr/kr/life/food.do" target="_blank" rel="noopener noreferrer">학교 원문 보기 ↗</a>
        </div>
      </aside>

      <section class="menu-panel" aria-labelledby="menuHeading">
        <div class="menu-heading">
          <div><p id="dateDisplay" class="menu-date"></p><h2 id="menuHeading" tabindex="-1">오늘의 메뉴</h2></div>
          <span id="menuCount" class="count-badge"></span>
        </div>
        <div id="restaurantStatus" class="status-banner" role="status" hidden></div>
        <div id="menuContent" class="menu-grid"></div>
        <div id="emptyState" class="empty-state" hidden><span class="empty-symbol" aria-hidden="true">◌</span><h3 id="emptyTitle">등록된 식단이 없습니다</h3><p id="emptyDescription"></p></div>
        <p class="calorie-note" id="calorieNote"></p>
      </section>
    </div>
    <footer class="site-footer"><p id="updatedAt"></p><p id="footerNote"></p><a href="https://github.com/zhupoxixixi/ajou-menu" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
  </main>
  <noscript><p class="noscript-note">JavaScript를 켜면 메뉴를 확인할 수 있습니다. 请启用 JavaScript 查看菜单。</p></noscript>
</body>
</html>
