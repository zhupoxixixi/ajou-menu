name: Daily Menu Scrape

on:
  schedule:
    - cron: '0 15 * * *'  # 15:00 UTC = 00:00 KST next day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_ENDPOINT: ${{ secrets.TRANSLATE_API_ENDPOINT }}
        run: python -m scraper.main

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ menu-data.js
          git diff --cached --quiet || git commit -m "Update weekly menu for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
