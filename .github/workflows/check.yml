name: Check Menu App
on:
  push:
    branches: [main]
    paths-ignore: ['menu-data.js', 'site/menu-data.js']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - name: Check public mirror
        run: |
          python -m scraper.sync_site
          git diff --exit-code -- site/
