name: Temporary menu HTML fetch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MENU_FETCH_TRANSPORT: reader_first
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u output/local-translation-20261116/github_fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: menu-html-20261116
          path: |
            output/local-translation-20261116/github-fetch.json
            output/local-translation-20261116/source-html/
